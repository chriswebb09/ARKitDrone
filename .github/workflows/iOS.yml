name: iOS

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: xcodebuild -project ARKitDrone/ARKitDrone.xcodeproj -scheme ARKitDrone -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
